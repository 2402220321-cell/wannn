<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiPerpus Mobile - Sistem Informasi Perpustakaan</title>
  
  <!-- Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Custom Style CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center font-sans antialiased">

  <!-- Mobile Simulator Wrapper Container -->
  <div class="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[850px] sm:max-h-[900px] sm:rounded-[36px] shadow-2xl relative overflow-hidden flex flex-col border-0 sm:border-8 border-slate-800">

    <!-- Top Status Bar (Simulated Mobile Header) -->
    <div class="bg-primary text-white text-xs px-6 pt-3 pb-2 flex justify-between items-center z-50 select-none">
      <span class="font-semibold tracking-wider">09:41</span>
      <div class="flex items-center gap-2">
        <span id="roleBadge" class="bg-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">ANGGOTA</span>
        <div class="flex items-center gap-1.5 opacity-90 text-[10px]">
          <i class="fas font-bold fa-wifi"></i>
          <i class="fas fa-battery-three-quarters text-sm"></i>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div id="mainContent" class="flex-1 overflow-y-auto pb-24 text-slate-800">

      <!-- ================= USER / ANGGOTA VIEWS ================= -->
      
      <!-- USER BERANDA -->
      <section id="view-user-beranda" class="view-section active p-5 space-y-5">
        <!-- Header User -->
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500 font-medium">Selamat datang kembali,</p>
            <h1 class="text-xl font-bold text-slate-800" id="userNameHeader">Rosa Ulina Ginting</h1>
          </div>
          <button onclick="toggleRoleSwitch()" class="w-10 h-10 rounded-full bg-blue-100 text-primary flex items-center justify-center font-bold text-sm shadow-sm hover:scale-105 transition-transform" title="Ganti Mode Role">
            RU
          </button>
        </div>

        <!-- Dynamic Card Status Pinjaman -->
        <div class="bg-gradient-to-br from-primary to-blue-700 rounded-2xl p-5 text-white shadow-lg shadow-blue-900/20 relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
          <p class="text-xs font-medium text-blue-100">Pinjaman Aktif Saat Ini</p>
          <div class="flex items-baseline justify-between mt-2">
            <h2 class="text-3xl font-extrabold" id="userActiveLoanCount">2 Buku</h2>
            <span class="bg-amber-400 text-amber-950 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
              <i class="fas font-bold fa-clock"></i> <span id="nearestDueDate">3 hari lagi</span>
            </span>
          </div>
          <div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center text-xs text-blue-100">
            <span>Batas Kuota Pinjam: 3 Buku</span>
            <button onclick="switchTab('user-pinjaman')" class="underline hover:text-white font-semibold">Lihat Detail &rarr;</button>
          </div>
        </div>

        <!-- Quick Access Shortcuts -->
        <div class="grid grid-cols-4 gap-3 text-center">
          <button onclick="switchTab('user-katalog')" class="flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-slate-200/60 transition">
            <div class="w-12 h-12 rounded-2xl bg-blue-100 text-primary flex items-center justify-center text-lg shadow-sm">
              <i class="fas fa-search"></i>
            </div>
            <span class="text-[11px] font-semibold text-slate-600">Cari Buku</span>
          </button>
          <button onclick="switchTab('user-scan')" class="flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-slate-200/60 transition">
            <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg shadow-sm">
              <i class="fas fa-qrcode"></i>
            </div>
            <span class="text-[11px] font-semibold text-slate-600">Pindai QR</span>
          </button>
          <button onclick="switchTab('user-pinjaman')" class="flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-slate-200/60 transition">
            <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg shadow-sm">
              <i class="fas fa-book-reader"></i>
            </div>
            <span class="text-[11px] font-semibold text-slate-600">Pinjaman</span>
          </button>
          <button onclick="openLocationModal()" class="flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-slate-200/60 transition">
            <div class="w-12 h-12 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center text-lg shadow-sm">
              <i class="fas fa-map-marker-alt"></i>
            </div>
            <span class="text-[11px] font-semibold text-slate-600">Lokasi</span>
          </button>
        </div>

        <!-- Buku Terbaru Carousel/List -->
        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-slate-800 text-base">Koleksi Terbaru</h3>
            <button onclick="switchTab('user-katalog')" class="text-primary text-xs font-semibold">Lihat Semua</button>
          </div>
          <div id="homeRecentBooks" class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
            <!-- Dynamic items rendered by JS -->
          </div>
        </div>

        <!-- Announcement Banner -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3.5 flex items-start gap-3">
          <i class="fas fa-bullhorn text-amber-600 text-lg mt-0.5"></i>
          <div class="text-xs text-amber-900">
            <p class="font-bold">Informasi Layanan Perpustakaan</p>
            <p class="text-amber-800 mt-0.5">Perpustakaan tutup pada hari libur nasional. Perpanjangan buku dapat dilakukan secara online melalui aplikasi.</p>
          </div>
        </div>
      </section>

      <!-- USER KATALOG -->
      <section id="view-user-katalog" class="view-section p-5 space-y-4">
